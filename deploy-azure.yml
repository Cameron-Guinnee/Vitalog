name: Deploy to Azure

# Publishes the web app to Azure Static Web Apps after CI passes on main.
# It needs the AZURE_STATIC_WEB_APPS_API_TOKEN secret, the deployment token of the
# Static Web App, plus the SUPABASE_URL and SUPABASE_ANON_KEY secrets for the build.
# Page routing, caching and security headers are set in
# apps/web/public/staticwebapp.config.json.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: # redeploy main by hand from the Actions tab

concurrency:
  group: deploy-azure
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # Only after a successful CI run for a push to main, never for pull requests.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check the deploy settings are in place
        env:
          AZURE_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          missing=""
          for name in AZURE_TOKEN SUPABASE_URL SUPABASE_ANON_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing deploy settings:$missing. See 'Deploying' in the README."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          # The commit CI tested, not whatever main points at now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @vitalog/web build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      # Uploads the finished build; Azure doesn't build it again.
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: apps/web/dist
          skip_app_build: true
          skip_api_build: true
